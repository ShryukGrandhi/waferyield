name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Tests
        run: pytest -q
      - name: Benchmark (quick)
        run: python bench/run_bench.py --quick
      - name: CLI smoke test
        run: |
          waferyield show edge_loc --seed 2
          waferyield fit-yield --wafers 200 --d0 0.3 --alpha 2
